apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interview-platform.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: {{ include "interview-platform.fullname" . }}-backend-sa
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            {{- range $name, $value := .Values.backend.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu | default "250m" }}
              memory: {{ .Values.backend.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu | default "1000m" }}
              memory: {{ .Values.backend.resources.limits.memory | default "1024Mi" }}
