apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: interview-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_FRONTEND_IMAGE
          ports:
            - containerPort: 80
