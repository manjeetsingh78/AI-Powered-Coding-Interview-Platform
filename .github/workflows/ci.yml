name: CI-CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      DEPLOY_ENV:
        description: 'Target environment for deploy'
        required: false
        default: 'staging'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_BIN: python3.11
  NODE_OPTIONS: '--max_old_space_size=4096'

jobs:

  # ─────────────────────────────────────────────────────────────
  # STAGE 1 — Gate: nothing runs without this
  # ─────────────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Check Python version
        run: |
          python - <<'PY'
          import sys
          major, minor = sys.version_info[:2]
          if (major, minor) < (3, 10):
              raise SystemExit(f"Python 3.10+ is required, but runner has {major}.{minor}")
          print(f"Python version OK: {major}.{minor}")
          PY

  # ─────────────────────────────────────────────────────────────
  # STAGE 2 — Parallel setup fan-out (all need preflight)
  # ─────────────────────────────────────────────────────────────
  initialize:
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
      - name: Capture build metadata
        run: |
          set -eux
          GIT_COMMIT_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-8)
          GIT_BRANCH_NAME="${GITHUB_REF_NAME}"
          GIT_VERSION=$(git describe --tags --always || echo v0.0.0)
          cat > build-info.json <<EOF
          {
            "build_id": "${GITHUB_RUN_NUMBER}",
            "git_commit": "${GIT_COMMIT_SHORT}",
            "git_branch": "${GIT_BRANCH_NAME}",
            "version": "${GIT_VERSION}",
            "image_tag": "${GITHUB_SHA}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          echo "Recorded build metadata for ${GIT_BRANCH_NAME} at ${GIT_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.sha }}
          path: build-info.json

  load_aws_credentials:
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Validate AWS settings
        run: |
          set -eux
          aws sts get-caller-identity
          echo "AWS_REGION=${{ secrets.AWS_REGION }}"
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}"
          echo "REPORTS_S3_BUCKET=${{ secrets.REPORTS_S3_BUCKET }}"

  backend:
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps & tools
        working-directory: backend
        run: |
          set -eux
          python3.11 -m pip install --upgrade pip setuptools wheel
          python3.11 -m pip install -r requirements.txt
          python3.11 -m pip install pytest pytest-cov pytest-django black flake8 pylint bandit safety
      - name: Lint, test, scan
        working-directory: backend
        run: |
          set -eux
          export SECRET_KEY='ci-temporary-secret'
          export DEBUG=True
          export DJANGO_SETTINGS_MODULE=config.test_settings
          python3.11 -m black .
          python3.11 -m flake8 --max-line-length=120 --exclude=migrations,venv
          python3.11 -m pylint apps/ config/ manage.py --disable=all --enable=E,F --disable=E1101,E0307 || true
          python3.11 -m pytest --junitxml=junit.xml --cov=apps --cov=config --cov-report=xml --cov-report=term-missing -v || true
          python3.11 -m bandit -r apps/ config/ -f json -o bandit-report.json || true
          python3.11 -m safety check --json > safety-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: backend-reports-${{ github.sha }}
          path: |
            backend/junit.xml
            backend/coverage.xml
            backend/bandit-report.json
            backend/safety-report.json

  frontend:
    runs-on: ubuntu-latest
    needs: [preflight, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, lint, test, build
        working-directory: frontend
        run: |
          set -eux
          npm ci --legacy-peer-deps
          npm run lint || true
          npm run coverage || npm run test || true
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts-${{ github.sha }}
          path: |
            frontend/dist
            frontend/coverage

  # ─────────────────────────────────────────────────────────────
  # STAGE 3 — SAST (NEW), integration tests, report upload
  #
  # SAST runs SonarQube against both backend and frontend in
  # parallel sub-jobs. It needs:
  #   • backend (coverage.xml produced there)
  #   • frontend (lcov.info produced there)
  #
  # Setup:
  #   1. Add SONAR_HOST_URL secret (e.g. https://sonar.yourco.com)
  #   2. Add SONAR_TOKEN secret (project analysis token from SonarQube)
  #   3. Create sonar-project-backend.properties and
  #      sonar-project-frontend.properties in your repo root
  #      (templates provided as comments below)
  # ─────────────────────────────────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    needs: [preflight, backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Check SonarQube secrets
        id: check_sonar
        run: |
          if [ -n "${{ secrets.SONAR_HOST_URL }}" ] && [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "sonar_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "sonar_enabled=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # SonarQube needs full git history for blame

      - name: Download ${{ matrix.component }} artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.component == 'backend' && format('backend-reports-{0}', github.sha) || format('frontend-artifacts-{0}', github.sha) }}
          path: ${{ matrix.component }}

      - name: SonarQube scan — ${{ matrix.component }}
        if: ${{ steps.check_sonar.outputs.sonar_enabled == 'true' }}
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ matrix.component }}
          args: >
            -Dsonar.projectKey=interview-platform-${{ matrix.component }}
            -Dsonar.projectName="Interview Platform ${{ matrix.component }}"
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,dist/**,migrations/**,venv/**,coverage/**
            ${{ matrix.component == 'backend' && '-Dsonar.language=py -Dsonar.python.coverage.reportPaths=coverage.xml -Dsonar.python.xunit.reportPath=junit.xml' || '-Dsonar.language=js -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info' }}

      - name: SonarQube quality gate check
        if: ${{ steps.check_sonar.outputs.sonar_enabled == 'true' }}
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  integration:
    runs-on: ubuntu-latest
    needs: [preflight, backend]
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      SECRET_KEY: 'ci-temporary-secret'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run integration tests
        working-directory: backend
        run: |
          set -eux
          export DB_HOST=127.0.0.1
          export DB_PORT=5433
          export DB_NAME=ci_db
          export DB_USER=ci
          export DB_PASSWORD=ci
          export SECRET_KEY='ci-temporary-secret'
          python3.11 -m pip install -r requirements.txt
          python3.11 manage.py migrate --settings=config.test_settings --noinput
          python3.11 -m pytest --ds=config.test_settings --junitxml=integration-junit.xml --cov=apps --cov=config --cov-report=term-missing -v || true
      - uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ github.sha }}
          path: backend/integration-junit.xml

  upload_reports_to_s3:
    runs-on: ubuntu-latest
    needs: [initialize, load_aws_credentials, backend, integration, frontend]
    if: ${{ always() }}
    env:
      REPORTS_S3_BUCKET: ${{ secrets.REPORTS_S3_BUCKET }}
      REPORTS_S3_PREFIX: reports
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.DEPLOY_ENV || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-reports-${{ github.sha }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: integration-reports-${{ github.sha }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: frontend-artifacts-${{ github.sha }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: build-info-${{ github.sha }}
          path: .
      - uses: aws-actions/configure-aws-credentials@v2
        if: ${{ env.REPORTS_S3_BUCKET != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload reports to S3
        if: ${{ env.REPORTS_S3_BUCKET != '' }}
        run: |
          set -eux
          chmod +x scripts/jenkins/upload_reports_to_s3.sh
          scripts/jenkins/upload_reports_to_s3.sh \
            "$REPORTS_S3_BUCKET" \
            "$REPORTS_S3_PREFIX" \
            "$DEPLOY_ENV" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_NUMBER}" \
            "$AWS_REGION"
      - name: Skip S3 upload (no bucket configured)
        if: ${{ env.REPORTS_S3_BUCKET == '' }}
        run: echo "REPORTS_S3_BUCKET not set; skipping."

  # ─────────────────────────────────────────────────────────────
  # STAGE 4 — Build Docker images
  #   Waits for integration + frontend (both test suites green)
  #   SAST is NOT a hard gate here — runs in parallel to save
  #   time, but you can add sast to needs[] to make it a hard gate
  # ─────────────────────────────────────────────────────────────
  build_and_push:
    runs-on: ubuntu-latest
    needs: [integration, frontend]
    env:
      BACKEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repo:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Set short commit
        run: echo "COMMIT_SHORT=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV
      - uses: aws-actions/amazon-ecr-login@v1
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repo:latest
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repo:latest

  # ─────────────────────────────────────────────────────────────
  # STAGE 5 — Deploy to staging (NEW)
  #
  # Uses the 'staging' GitHub Environment (Settings → Environments).
  # Staging environment can have its own secrets (e.g. a staging
  # kubeconfig) scoped separately from production secrets.
  #
  # Setup:
  #   1. Create a 'staging' environment in GitHub repo settings
  #   2. Add KUBECONFIG_STAGING secret to that environment
  #      (base64-encoded kubeconfig for the staging cluster)
  # ─────────────────────────────────────────────────────────────
  deploy_staging:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    environment: staging          # <-- links to GitHub Environment named 'staging'
    env:
      BACKEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repo:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version --short
      - name: Determine how to obtain staging kubeconfig
        id: obtain_kube_staging
        run: |
          # Prefer explicit KUBECONFIG_STAGING secret, fall back to EKS if AWS creds+cluster present
          if [ -n "${{ secrets.KUBECONFIG_STAGING }}" ]; then
            echo "method=secret" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.AWS_REGION }}" ]; then
            if [ -n "${{ secrets.CLUSTER_NAME_STAGING }}" ]; then
              echo "method=eks" >> $GITHUB_OUTPUT
              echo "cluster_name=${{ secrets.CLUSTER_NAME_STAGING }}" >> $GITHUB_OUTPUT
            elif [ -n "${{ secrets.CLUSTER_NAME }}" ]; then
              echo "method=eks" >> $GITHUB_OUTPUT
              echo "cluster_name=${{ secrets.CLUSTER_NAME }}" >> $GITHUB_OUTPUT
            else
              echo "method=none" >> $GITHUB_OUTPUT
            fi
          else
            echo "method=none" >> $GITHUB_OUTPUT
          fi
      - name: Write staging kubeconfig from secret
        if: "${{ steps.obtain_kube_staging.outputs.method == 'secret' }}"
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          kubectl config current-context
      - name: Write staging kubeconfig via EKS
        if: "${{ steps.obtain_kube_staging.outputs.method == 'eks' }}"
        run: |
          set -eux
          aws eks update-kubeconfig --name "${{ steps.obtain_kube_staging.outputs.cluster_name }}" --region "${{ secrets.AWS_REGION }}"
          kubectl config current-context
      - name: Fail: missing staging kubeconfig
        if: "${{ steps.obtain_kube_staging.outputs.method == 'none' }}"
        run: |
          echo "No kubeconfig available for staging. Set KUBECONFIG_STAGING or provide AWS creds with CLUSTER_NAME_STAGING/CLUSTER_NAME."
          exit 1
      - name: Deploy backend to staging
        run: |
          set -eux
          helm upgrade --install interview-backend-staging \
            ./deploy/helm/interview-platform \
            --namespace staging \
            --create-namespace \
            -f deploy/helm/values-staging.yaml \
            --set backend.image=${{ env.BACKEND_IMAGE }} \
            --set frontend.skip=true \
            --set replicaCount=1 \
            --wait --timeout 10m
      - name: Cleanup stale staging frontend resources
        run: |
          set -eux
          for kind in service deployment; do
            rel_name="$(kubectl get "$kind" interview-platform-frontend -n staging \
              -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)"
            if [ "$rel_name" = "interview-backend-staging" ]; then
              kubectl delete "$kind" interview-platform-frontend -n staging --ignore-not-found
            fi
          done
      - name: Deploy frontend to staging
        run: |
          set -eux
          helm upgrade --install interview-frontend-staging \
            ./deploy/helm/interview-platform \
            --namespace staging \
            --create-namespace \
            -f deploy/helm/values-staging.yaml \
            --set frontend.image=${{ env.FRONTEND_IMAGE }} \
            --set backend.skip=true \
            --set replicaCount=1 \
            --wait --timeout 10m
      - name: Show staging pods
        run: kubectl get pods -n staging

  # ─────────────────────────────────────────────────────────────
  # STAGE 5b — Smoke tests against staging
  #
  # Runs after staging is live. Polls the staging service URL and
  # runs your smoke_test.sh script. Failure here blocks the
  # approval gate and production deploy.
  # ─────────────────────────────────────────────────────────────
  smoke_tests:
    runs-on: ubuntu-latest
    needs: [deploy_staging]
    steps:
      - uses: actions/checkout@v4
      - name: Determine how to obtain staging kubeconfig for smoke tests
        id: obtain_kube_staging_smoke
        run: |
          if [ -n "${{ secrets.KUBECONFIG_STAGING }}" ]; then
            echo "method=secret" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.AWS_REGION }}" ]; then
            if [ -n "${{ secrets.CLUSTER_NAME_STAGING }}" ]; then
              echo "method=eks" >> $GITHUB_OUTPUT
              echo "cluster_name=${{ secrets.CLUSTER_NAME_STAGING }}" >> $GITHUB_OUTPUT
            elif [ -n "${{ secrets.CLUSTER_NAME }}" ]; then
              echo "method=eks" >> $GITHUB_OUTPUT
              echo "cluster_name=${{ secrets.CLUSTER_NAME }}" >> $GITHUB_OUTPUT
            else
              echo "method=none" >> $GITHUB_OUTPUT
            fi
          else
            echo "method=none" >> $GITHUB_OUTPUT
          fi
      - name: Write staging kubeconfig from secret
        if: "${{ steps.obtain_kube_staging_smoke.outputs.method == 'secret' }}"
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Write staging kubeconfig via EKS
        if: "${{ steps.obtain_kube_staging_smoke.outputs.method == 'eks' }}"
        run: |
          set -eux
          aws eks update-kubeconfig --name "${{ steps.obtain_kube_staging_smoke.outputs.cluster_name }}" --region "${{ secrets.AWS_REGION }}"
      - name: Fail: missing staging kubeconfig for smoke tests
        if: "${{ steps.obtain_kube_staging_smoke.outputs.method == 'none' }}"
        run: |
          echo "No kubeconfig available for smoke tests. Set KUBECONFIG_STAGING or provide AWS creds with CLUSTER_NAME_STAGING/CLUSTER_NAME."
          exit 1
      - name: Wait for staging deployments to be available
        run: |
          set -eux
          kubectl wait --for=condition=available --timeout=300s \
            deployment/interview-backend-staging -n staging
          kubectl wait --for=condition=available --timeout=300s \
            deployment/interview-frontend-staging -n staging
      - name: Resolve staging URL and run smoke tests
        run: |
          set -eux
          SERVICE_URL=$(kubectl get svc -n staging interview-platform-frontend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null \
            || echo "localhost:3000")
          echo "Smoke testing: http://$SERVICE_URL"
          chmod +x scripts/jenkins/smoke_test.sh
          bash scripts/jenkins/smoke_test.sh "http://$SERVICE_URL"

  # ─────────────────────────────────────────────────────────────
  # STAGE 6 — Container image scanning
  #   Runs in parallel with staging deploy to save time
  # ─────────────────────────────────────────────────────────────
  scan:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    env:
      BACKEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repo:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan images
        if: ${{ always() }}
        run: |
          set -eux
          if command -v trivy >/dev/null 2>&1; then
            trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ env.BACKEND_IMAGE }} || true
            trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ env.FRONTEND_IMAGE }} || true
          else
            echo "Trivy not on runner; skipping"
          fi
      - name: Snyk scan (optional)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -eux
          if [ -z "$SNYK_TOKEN" ]; then echo "No SNYK_TOKEN; skipping"; exit 0; fi
          echo "$SNYK_TOKEN" | snyk auth || true
          snyk test --docker ${{ env.BACKEND_IMAGE }} || true

  # ─────────────────────────────────────────────────────────────
  # STAGE 7 — Production approval gate (NEW)
  #
  # This job uses the 'production' GitHub Environment.
  # The environment protection rule IS the approval gate —
  # GitHub pauses execution here and sends review requests to
  # the required reviewers you configured in Settings → Environments.
  # The job itself does nothing except act as the gating node.
  #
  # Setup (one-time, in GitHub UI):
  #   1. Settings → Environments → New environment → "production"
  #   2. Enable "Required reviewers" → add your team leads
  #   3. Optionally enable "Wait timer" (e.g. 10 min cooldown)
  #   4. Add KUBECONFIG_PROD secret to this environment
  # ─────────────────────────────────────────────────────────────
  approval_gate:
    runs-on: ubuntu-latest
    needs: [smoke_tests, scan, sast]   # ALL three must pass before reviewers are even notified
    environment: production             # <-- this line is the gate; GitHub blocks here for approval
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.DEPLOY_ENV == 'production' }}
    steps:
      - name: Approval granted
        run: |
          echo "Production deployment approved."
          echo "Approved at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Triggered by: ${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"

  # ─────────────────────────────────────────────────────────────
  # STAGE 8 — Production deploy
  #   Only runs after approval_gate succeeds (i.e. a reviewer
  #   clicked Approve in the GitHub Actions UI for this run)
  # ─────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [approval_gate]
    env:
      BACKEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repo:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version --short
      - name: Determine how to obtain production kubeconfig
        id: obtain_kube_prod
        run: |
          if [ -n "${{ secrets.KUBECONFIG_PROD }}" ]; then
            echo "method=secret" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.AWS_REGION }}" ]; then
            if [ -n "${{ secrets.CLUSTER_NAME_PROD }}" ]; then
              echo "method=eks" >> $GITHUB_OUTPUT
              echo "cluster_name=${{ secrets.CLUSTER_NAME_PROD }}" >> $GITHUB_OUTPUT
            elif [ -n "${{ secrets.CLUSTER_NAME }}" ]; then
              echo "method=eks" >> $GITHUB_OUTPUT
              echo "cluster_name=${{ secrets.CLUSTER_NAME }}" >> $GITHUB_OUTPUT
            else
              echo "method=none" >> $GITHUB_OUTPUT
            fi
          else
            echo "method=none" >> $GITHUB_OUTPUT
          fi
      - name: Write production kubeconfig from secret
        if: "${{ steps.obtain_kube_prod.outputs.method == 'secret' }}"
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          kubectl config current-context
      - name: Write production kubeconfig via EKS
        if: "${{ steps.obtain_kube_prod.outputs.method == 'eks' }}"
        run: |
          set -eux
          aws eks update-kubeconfig --name "${{ steps.obtain_kube_prod.outputs.cluster_name }}" --region "${{ secrets.AWS_REGION }}"
          kubectl config current-context
      - name: Fail: missing production kubeconfig
        if: "${{ steps.obtain_kube_prod.outputs.method == 'none' }}"
        run: |
          echo "No kubeconfig available for production. Set KUBECONFIG_PROD or provide AWS creds with CLUSTER_NAME_PROD/CLUSTER_NAME."
          exit 1
      - name: Show AWS identity
        run: |
          set -eux
          aws sts get-caller-identity
          aws eks describe-cluster --name interview-platform-eks --region "${{ secrets.AWS_REGION }}" --query 'cluster.status'
      - name: Deploy backend via Helm
        run: |
          set -eux
          helm upgrade --install interview-backend \
            ./deploy/helm/interview-platform \
            --namespace production \
            --create-namespace \
            -f deploy/helm/values-production.yaml \
            --set backend.image=${{ env.BACKEND_IMAGE }} \
            --set frontend.skip=true \
            --set replicaCount=3 \
            --wait --timeout 15m
      - name: Cleanup stale production frontend resources
        run: |
          set -eux
          for kind in service deployment; do
            rel_name="$(kubectl get "$kind" interview-platform-frontend -n production \
              -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)"
            if [ "$rel_name" = "interview-backend" ]; then
              kubectl delete "$kind" interview-platform-frontend -n production --ignore-not-found
            fi
          done
      - name: Deploy frontend via Helm
        run: |
          set -eux
          helm upgrade --install interview-frontend \
            ./deploy/helm/interview-platform \
            --namespace production \
            --create-namespace \
            -f deploy/helm/values-production.yaml \
            --set frontend.image=${{ env.FRONTEND_IMAGE }} \
            --set backend.skip=true \
            --set replicaCount=3 \
            --wait --timeout 15m
      - name: Post-deploy verification
        run: |
          set -eux
          kubectl wait --for=condition=available --timeout=300s \
            deployment/interview-platform-backend -n production
          kubectl wait --for=condition=available --timeout=300s \
            deployment/interview-platform-frontend -n production
          FRONTEND_URL=$(kubectl get svc -n production interview-platform-frontend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || echo "pending")
          echo "Production URL: $FRONTEND_URL"
          kubectl get pods -n production