name: CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      RUN_EXTRA_CHECKS:
        description: 'Run extra checks (lint, tests, integration, reports)'
        required: false
        default: 'false'
      DEPLOY_ENV:
        description: 'Target environment for deploy'
        required: false
        default: 'staging'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_BIN: python3.11
  NODE_OPTIONS: '--max_old_space_size=4096'

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: ${{ inputs.RUN_EXTRA_CHECKS == 'true' || github.event.inputs.RUN_EXTRA_CHECKS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Python version
        run: |
          python3.11 - <<'PY'
          import sys
          major, minor = sys.version_info[:2]
          if (major, minor) < (3, 10):
              raise SystemExit(f"Python 3.10+ is required, but runner has {major}.{minor}")
          print(f"Python version OK: {major}.{minor}")
          PY

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps & tools
        working-directory: backend
        run: |
          set -eux
          python3.11 -m pip install --upgrade pip setuptools wheel
          python3.11 -m pip install -r requirements.txt
          python3.11 -m pip install pytest pytest-cov pytest-django black flake8 pylint bandit safety
      - name: Run linters and tests
        working-directory: backend
        run: |
          set -eux
          export SECRET_KEY='ci-temporary-secret'
          export DEBUG=True
          export DJANGO_SETTINGS_MODULE=config.test_settings
          python3.11 -m black .
          python3.11 -m flake8 --max-line-length=120 --exclude=migrations,venv
          python3.11 -m pylint apps/ config/ manage.py --disable=all --enable=E,F --disable=E1101,E0307 || true
          python3.11 -m pytest --junitxml=junit.xml --cov=apps --cov=config --cov-report=term-missing -v || true
          python3.11 -m bandit -r apps/ config/ -f json -o bandit-report.json || true
          python3.11 -m safety check --json > safety-report.json || true
      - name: Upload backend test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-${{ github.sha }}
          path: backend/junit.xml,backend/bandit-report.json,backend/safety-report.json

  integration:
    runs-on: ubuntu-latest
    needs: [backend]
    # integration tests run by default; previously gated behind RUN_EXTRA_CHECKS
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run integration tests
        working-directory: backend
        run: |
          set -eux
          export DB_HOST=127.0.0.1
          export DB_PORT=5433
          export DB_NAME=ci_db
          export DB_USER=ci
          export DB_PASSWORD=ci
          python3.11 -m pip install -r requirements.txt
          python3.11 manage.py migrate --noinput
          python3.11 -m pytest --junitxml=integration-junit.xml --cov=apps --cov=config --cov-report=term-missing -v || true
      - name: Upload integration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ github.sha }}
          path: backend/integration-junit.xml

  frontend:
    runs-on: ubuntu-latest
    needs: [backend]
    # frontend build runs by default; previously gated behind RUN_EXTRA_CHECKS
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build frontend
        working-directory: frontend
        run: |
          set -eux
          npm ci --legacy-peer-deps
          npm run lint || true
          npm run coverage || npm run test || true
          npm run build
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts-${{ github.sha }}
          path: frontend/dist,frontend/coverage

  build_and_push:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      BACKEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repo:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Set COMMIT_SHORT
        run: |
          # Make an 8-char short commit available to later steps
          echo "COMMIT_SHORT=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
      # Image tags are set as job-level environment variables so they're available
      # to the docker/build-push-action inputs at step runtime.
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

  scan:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan images
        if: ${{ always() }}
        run: |
          set -eux
          if command -v trivy >/dev/null 2>&1; then
            trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ env.BACKEND_IMAGE }} || true
            trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ env.FRONTEND_IMAGE }} || true
          else
            echo "Trivy not installed on runner; skipping image scan"
          fi
      - name: Snyk scan (optional)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -eux
          if [ -z "$SNYK_TOKEN" ]; then echo "No SNYK_TOKEN provided; skipping Snyk scan"; exit 0; fi
          echo "$SNYK_TOKEN" | snyk auth || true
          snyk test --docker ${{ env.BACKEND_IMAGE }} || true

  deploy:
    runs-on: ubuntu-latest
    needs: [scan]
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.DEPLOY_ENV == 'production' || github.event.inputs.DEPLOY_ENV == 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version --short
      - name: Configure kubeconfig for EKS
        run: |
          set -eux
          aws eks update-kubeconfig --name "interview-platform-eks" --region "${{ secrets.AWS_REGION }}"
          kubectl config current-context
      - name: Show AWS identity
        run: |
          set -eux
          aws sts get-caller-identity
          aws eks describe-cluster --name interview-platform-eks --region "${{ secrets.AWS_REGION }}" --query 'cluster.status'
          aws eks list-access-entries --cluster-name interview-platform-eks --region "${{ secrets.AWS_REGION }}"
          aws eks describe-access-entry --cluster-name interview-platform-eks --principal-arn "$(aws sts get-caller-identity --query Arn --output text)" --region "${{ secrets.AWS_REGION }}" || true
      - name: Deploy backend via Helm
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -eux
          helm upgrade --install interview-backend ./deploy/helm/interview-platform --set backend.image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repo:${{ github.sha }} --set frontend.skip=true
      - name: Cleanup stale frontend resources owned by backend release
        run: |
          set -eux
          for kind in service deployment; do
            rel_name="$(kubectl get "$kind" interview-platform-frontend -n default -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)"
            if [ "$rel_name" = "interview-backend" ]; then
              kubectl delete "$kind" interview-platform-frontend -n default --ignore-not-found
            fi
          done
      - name: Deploy frontend via Helm
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -eux
          helm upgrade --install interview-frontend ./deploy/helm/interview-platform --set frontend.image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repo:${{ github.sha }} --set backend.skip=true
