name: Terraform

# Jenkins on AWS is the source of truth for CI/CD.
# Keep this workflow manual only so Terraform changes are applied from Jenkins.
on:
  workflow_dispatch:

jobs:
  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -var-file=terraform.tfvars -out=tfplan
      - name: Notify Discord (plan)
        if: ${{ secrets.DISCORD_WEBHOOK != '' || secrets.DISCORD_WEBHOOK_PR != '' || secrets.DISCORD_WEBHOOK_STAGING != '' || secrets.DISCORD_WEBHOOK_PRODUCTION != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PR || secrets.DISCORD_WEBHOOK_STAGING || secrets.DISCORD_WEBHOOK || secrets.DISCORD_WEBHOOK_PRODUCTION }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No Discord webhook configured for this context"; exit 0; fi
          PAYLOAD=$(jq -n --arg job "${{ github.job }}" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{username: "Terraform Bot", embeds: [{title: ("Terraform Plan - " + $job), url: $url}] }')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
